[snippets]
custom_paths = []
include_default_snippets = true

[package_management]
manager = "uv"

[formatting]
line_length = 79

[display]
theme = "dark"
default_width = "full"
code_editor_font_size = 12
cell_output = "below"
dataframes = "rich"

[save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = false

[completion]
activate_on_typing = true
copilot = false

[keymap]
preset = "vim"
[keymap.overrides]

[runtime]
on_cell_change = "lazy"
pythonpath = []
output_max_bytes = 8000000
watcher_on_save = "lazy"
auto_instantiate = false
std_stream_max_bytes = 1000000
auto_reload = "lazy"

[language_servers.pylsp]
enable_ruff = true
enable_mypy = true
enable_flake8 = false
enable_pylint = false
enable_pydocstyle = false
enable_pyflakes = false
enabled = true

[server]
follow_symlink = false
browser = "default"

[ai]
rules = ""
[ai.open_ai]

[ai.anthropic]

[ai.google]

[experimental]
