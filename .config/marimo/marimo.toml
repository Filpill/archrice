[keymap]
preset = "vim"

[keymap.overrides]
"cell.createAbove" = "Ctrl-Shift-arrowup"
"cell.createBelow" = "Ctrl-Shift-arrowdown"

[server]
browser = "default"
follow_symlink = false

[completion]
copilot = false
activate_on_typing = true

[save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = false

[experimental]

[snippets]
custom_paths = []
include_default_snippets = true

[runtime]
auto_reload = "lazy"
auto_instantiate = false
watcher_on_save = "lazy"
pythonpath = []
std_stream_max_bytes = 1000000
output_max_bytes = 8000000
on_cell_change = "lazy"

[display]
cell_output = "below"
code_editor_font_size = 12
dataframes = "rich"
theme = "dark"
default_width = "full"

[ai]
rules = ""
[ai.anthropic]

[ai.google]

[ai.open_ai]

[language_servers.pylsp]
enable_mypy = true
enabled = true
enable_pydocstyle = false
enable_pylint = false
enable_ruff = true
enable_flake8 = false
enable_pyflakes = false

[package_management]
manager = "uv"

[formatting]
line_length = 79
